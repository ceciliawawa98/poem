<script>
const POEMS = [
 {id:"p1",title:"靜夜思",author:"李白",dynasty:"唐",form:"五言古絕",
  lines:["床前明月光","疑是地上霜","舉頭望明月","低頭思故鄉"],
  notes:[["床","一說指井欄，一說指睡覺的床。"],["疑","好像、以為。"],["舉頭","抬起頭。"],["故鄉","家鄉、出生成長的地方。"]],
  trans:"床前灑滿了明亮的月光，看起來好像地上結了一層白霜。抬起頭望著天上的明月，低下頭不禁想念起遠方的家鄉。",
  appr:"全詩只有二十個字，沒有一個難字，卻把思鄉寫得很深。「疑」字寫出半夜醒來、看不清楚的恍惚感；「舉頭」和「低頭」兩個動作一上一下，從看月亮自然轉到想家，情感不用明說就流露出來，所以千百年來人人都會背。",
  bio:"李白（701–762），字太白，號青蓮居士，唐代最有名的詩人之一，被稱為「詩仙」。他的詩豪放飄逸、想像力豐富，常寫月亮、喝酒和遊歷山水。"},
 {id:"p2",title:"春曉",author:"孟浩然",dynasty:"唐",form:"五言絕句",
  lines:["春眠不覺曉","處處聞啼鳥","夜來風雨聲","花落知多少"],
  notes:[["曉","天剛亮的時候。"],["不覺曉","不知不覺天就亮了。"],["聞","聽見。"],["啼鳥","鳥兒鳴叫。"],["知多少","不知道有多少。"]],
  trans:"春天的夜晚睡得香甜，不知不覺天已經亮了，到處都能聽到鳥兒在歌唱。想起昨天夜裡傳來的風雨聲，不知道又吹落了多少花朵呢？",
  appr:"這首詩幾乎都用「聽覺」寫春天：鳥叫聲、風雨聲。詩人沒有起床去看，卻想像著外面的落花，在明亮輕快的春晨裡，帶出一點珍惜春光的淡淡惆悵。",
  bio:"孟浩然（689–740），唐代山水田園詩人，一生大多隱居在家鄉襄陽，和王維並稱「王孟」。李白很欣賞他，寫過「吾愛孟夫子」的詩句。"},
 {id:"p3",title:"登鸛雀樓",author:"王之渙",dynasty:"唐",form:"五言絕句",
  lines:["白日依山盡","黃河入海流","欲窮千里目","更上一層樓"],
  notes:[["鸛雀樓","古樓名，在今山西永濟，前望中條山，下臨黃河。"],["依","靠著、挨著。"],["盡","消失。"],["窮","盡、看到最遠處。"],["千里目","看到千里遠的眼力。"]],
  trans:"太陽靠著西邊的山慢慢落下，黃河的水向著大海奔流而去。如果想要看到千里之外的景色，就要再登上一層樓。",
  appr:"前兩句寫景：一山一河、一落一流，畫面又大又有氣勢。後兩句說道理：站得越高，看得越遠。「更上一層樓」後來成為鼓勵人不斷進步的名句，到今天還常被引用。",
  bio:"王之渙（688–742），盛唐詩人，擅長描寫邊塞風光。他留下來的詩只有六首，但〈登鸛雀樓〉和〈涼州詞〉都是千古名作。"},
 {id:"p4",title:"江雪",author:"柳宗元",dynasty:"唐",form:"五言絕句",
  lines:["千山鳥飛絕","萬徑人蹤滅","孤舟蓑笠翁","獨釣寒江雪"],
  notes:[["絕","斷絕，完全沒有。"],["徑","小路。"],["人蹤","人的腳印。"],["蓑笠","蓑衣（草編雨衣）和斗笠。"],["翁","老人家。"]],
  trans:"千山萬嶺看不到一隻飛鳥，無數條小路上也沒有一個人的腳印。只有一條小船上，一位穿著蓑衣、戴著斗笠的老漁翁，獨自在大雪紛飛的寒冷江面上釣魚。",
  appr:"前兩句用「千」「萬」寫出天地又大又安靜，後兩句鏡頭一下拉近，只剩「孤」舟、「獨」釣的一個人。這首詩寫於柳宗元被貶到永州的時候，那位不怕寒冷的漁翁，也像是詩人自己：孤單，卻依然堅持。",
  bio:"柳宗元（773–819），字子厚，唐代文學家、思想家，「唐宋八大家」之一。被貶永州期間寫下許多山水名作，例如〈永州八記〉。"},
 {id:"p5",title:"相思",author:"王維",dynasty:"唐",form:"五言絕句",
  lines:["紅豆生南國","春來發幾枝","願君多采擷","此物最相思"],
  notes:[["紅豆","又名相思子，種子鮮紅，古人用來象徵思念。"],["南國","南方。"],["發","生長、冒出新枝。"],["采擷","摘取。"]],
  trans:"紅豆生長在南方，春天來了，又長出了幾根新枝呢？希望你多摘一些，因為它最能寄託思念之情。",
  appr:"詩人不直接說「我想念你」，而是請朋友多採一些紅豆，用一顆小小的紅豆裝滿想念，語氣親切又含蓄。（有些版本作「秋來發幾枝」、「勸君休采擷」。）",
  bio:"王維（701?–761），字摩詰，唐代詩人、畫家，也精通音樂，被稱為「詩佛」。蘇軾稱讚他「詩中有畫，畫中有詩」。"},
 {id:"p6",title:"楓橋夜泊",author:"張繼",dynasty:"唐",form:"七言絕句",
  lines:["月落烏啼霜滿天","江楓漁火對愁眠","姑蘇城外寒山寺","夜半鐘聲到客船"],
  notes:[["楓橋","橋名，在今江蘇蘇州。"],["泊","把船停靠在岸邊。"],["烏啼","烏鴉鳴叫。"],["漁火","漁船上的燈火。"],["姑蘇","蘇州的別稱。"],["寒山寺","蘇州城外的古寺。"]],
  trans:"月亮西沉，烏鴉啼叫，寒霜的冷氣布滿了天空；我對著江邊的楓樹和點點漁火，滿懷旅途的憂愁睡不著。這時，蘇州城外寒山寺半夜敲響的鐘聲，一聲聲傳到了我的客船上。",
  appr:"前兩句把月、烏鴉、霜、楓樹、漁火疊在一起，畫出一個清冷的秋夜。後兩句用一聲鐘響打破寂靜，「以聲襯靜」，反而讓夜更安靜、旅人更孤單。寒山寺也因這首詩名聞天下。",
  bio:"張繼，唐代詩人，生卒年不詳，天寶年間考中進士。作品流傳不多，卻靠〈楓橋夜泊〉一首詩留名千古。"},
 {id:"p7",title:"詠鵝",author:"駱賓王",dynasty:"唐",form:"古體詩",
  lines:["鵝鵝鵝","曲項向天歌","白毛浮綠水","紅掌撥清波"],
  notes:[["曲項","彎彎的脖子。"],["歌","這裡指鵝的鳴叫。"],["掌","鵝的腳掌。"],["撥","划動。"],["清波","清澈的水波。"]],
  trans:"鵝！鵝！鵝！彎著脖子朝天空高聲歌唱。雪白的羽毛浮在碧綠的水面上，紅紅的腳掌撥動著清清的水波。",
  appr:"相傳這是駱賓王七歲時寫的。先寫叫聲，再寫樣子和動作；白、綠、紅、清，顏色鮮明又可愛，就像一幅會動的畫，是很多小朋友背的第一首詩。",
  bio:"駱賓王（約640–684?），唐代詩人，「初唐四傑」之一，從小就有神童之稱。"},
 {id:"p8",title:"憫農",author:"李紳",dynasty:"唐",form:"五言古絕",
  lines:["鋤禾日當午","汗滴禾下土","誰知盤中飧","粒粒皆辛苦"],
  notes:[["憫","憐憫、同情。"],["鋤禾","用鋤頭在禾苗間鬆土除草。"],["當午","正中午。"],["飧","煮熟的飯食。"]],
  trans:"農夫在正中午的大太陽下鋤地，汗水一滴滴落進禾苗下的泥土裡。有誰知道碗盤裡的飯，每一粒都是農夫辛辛苦苦種出來的呢？",
  appr:"前兩句畫面很具體：烈日、汗水、泥土；後兩句一個提問，提醒我們珍惜食物。「粒粒皆辛苦」成了大人教小朋友不要浪費的名句。",
  bio:"李紳（772–846），唐代詩人，後來當過宰相，和白居易、元稹是好朋友。〈憫農〉兩首是他最有名的作品。"},
 {id:"p9",title:"遊子吟",author:"孟郊",dynasty:"唐",form:"五言古詩",
  lines:["慈母手中線","遊子身上衣","臨行密密縫","意恐遲遲歸","誰言寸草心","報得三春暉"],
  notes:[["遊子","離家遠行的人。"],["意恐","心裡擔心。"],["寸草心","小草的心，比喻子女的心意。"],["三春暉","春天的陽光，比喻母親的愛。"]],
  trans:"慈愛的母親拿著針線，為要出遠門的孩子縫衣服。臨走前一針一線縫得又密又牢，就怕孩子很久才能回家。誰說像小草一樣小小的心意，能報答春天陽光般的恩情呢？",
  appr:"用「縫衣服」這個日常小動作，寫出深深的母愛。最後用小草和春天的陽光作比喻：陽光給了小草生命，小草卻很難回報，就像母親的恩情。",
  bio:"孟郊（751–814），字東野，唐代詩人，四十多歲才考上進士。詩風清冷，和賈島並稱「郊寒島瘦」。"},
 {id:"p10",title:"登樂遊原",author:"李商隱",dynasty:"唐",form:"五言絕句",
  lines:["向晚意不適","驅車登古原","夕陽無限好","只是近黃昏"],
  notes:[["樂遊原","在長安城南，地勢高，可以看到整座城，是唐代人喜歡去的地方。"],["向晚","傍晚。"],["意不適","心情不太好。"],["驅車","駕著車。"],["古原","指樂遊原。"]],
  trans:"傍晚時心裡有些悶悶的，於是駕著車登上古老的樂遊原。夕陽的景色無比美好，只可惜已經快到黃昏了。",
  appr:"前兩句說為什麼來登高，後兩句寫夕陽。「夕陽無限好，只是近黃昏」寫出美好的東西總是留不久的感嘆；也有人把它讀成提醒：要珍惜眼前的美好時光。",
  bio:"李商隱（約813–858），字義山，號玉谿生，晚唐詩人。詩風深情含蓄、喜歡用典故，和杜牧並稱「小李杜」。"},
 {id:"p11",title:"夜雨寄北",author:"李商隱",dynasty:"唐",form:"七言絕句",
  lines:["君問歸期未有期","巴山夜雨漲秋池","何當共剪西窗燭","卻話巴山夜雨時"],
  notes:[["寄北","寄給住在北方的人（一說是妻子，一說是朋友）。"],["巴山","泛指四川東部一帶的山。"],["秋池","秋天的池塘。"],["何當","什麼時候才能。"],["剪燭","剪去燒焦的燭芯讓燭光更亮，指夜裡促膝長談。"],["卻話","回過頭來說起。"]],
  trans:"你問我什麼時候回去，我也說不準日子；此刻巴山正下著夜雨，雨水漲滿了秋天的池塘。什麼時候才能和你一起在西窗下剪著燭芯，再聊起今晚巴山夜雨的情景呢？",
  appr:"「巴山夜雨」出現了兩次：第一次是眼前一個人聽雨的孤單，第二次是想像將來重聚時，把今晚當成回憶來聊。現在和未來交錯在一起，讓思念顯得溫柔又綿長。",
  bio:"李商隱（約813–858），字義山，號玉谿生，晚唐詩人。詩風深情含蓄、喜歡用典故，和杜牧並稱「小李杜」。"},
 {id:"p12",title:"嫦娥",author:"李商隱",dynasty:"唐",form:"七言絕句",
  lines:["雲母屏風燭影深","長河漸落曉星沉","嫦娥應悔偷靈藥","碧海青天夜夜心"],
  notes:[["雲母屏風","用雲母石裝飾的屏風。"],["燭影深","燭光越來越暗。"],["長河","銀河。"],["曉星","清晨天快亮時的星星。"],["靈藥","傳說中吃了能成仙的不死藥。"],["碧海青天","形容嫦娥住的月宮四周空曠無邊。"]],
  trans:"雲母屏風上的燭影越來越暗，銀河漸漸西斜，晨星也慢慢落下。嫦娥應該後悔偷吃了靈藥吧，如今只能在碧海青天之間，每天晚上獨自寂寞。",
  appr:"詩從一夜沒睡寫起，再借「嫦娥奔月」的神話，寫出長夜裡孤單寂寞的心情。表面上在寫嫦娥，其實也像在寫詩人自己。",
  bio:"李商隱（約813–858），字義山，號玉谿生，晚唐詩人。詩風深情含蓄、喜歡用典故，和杜牧並稱「小李杜」。"}
];

let tab="notes", reading=false;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

function buildNav(cur){
  $("#nav").innerHTML=`<button class="${cur==='intro'?'on':''}" onclick="go('intro')">序言 <span></span></button>`+
   POEMS.map((p,i)=>`<button class="${cur===p.id?'on':''}" onclick="go('${p.id}')">${i+1}. ${p.title}<span>${p.author}</span></button>`).join("");
}

function tools(){
  return `<div class="tools">
   <button class="btn menuBtn" onclick="$('#side').classList.toggle('open')">☰ 目錄</button>
   <button class="btn" onclick="zoom(.1)">字 ＋</button>
   <button class="btn" onclick="zoom(-.1)">字 －</button>
   <button class="btn" onclick="copyLink()">🔗 複製連結</button></div>`;
}

function renderIntro(){
  $("#main").innerHTML=tools()+`<section class="intro">
   <div class="introHead"><div><h2>古詩誦賞</h2><p>一葉扁舟・山水之間讀一首詩</p></div><button class="zheng" onclick="toggleMusic(event)">${guzheng()}<span class="lbl">🎵 點古箏，開始／停止音樂</span></button></div>
   <h2 style="font-size:26px;letter-spacing:6px">序言</h2>
   <p>古詩短短幾句，卻裝著一千多年前的月光、風雨和思念。這裡收錄了大家從小就會背的經典唐詩，每一首都有<b>原文、注釋、白話語譯、賞析和作者介紹</b>，還可以按「朗讀」讓網站念給你聽，一句一句跟著亮起來。</p>
   <p>適合親子一起讀、自己複習，或睡前慢慢聽一首。</p>
   <div class="cards">${POEMS.map(p=>`<div class="card" onclick="go('${p.id}')"><b>${p.title}</b><div>${p.dynasty}・${p.author}｜${p.form}</div></div>`).join("")}</div>
<div class="fbBox"><p>喜歡這首詩嗎？🌸</p><p>追蹤我們的粉絲專頁，每週一起讀一首好詩、玩免費小遊戲！</p>
   <a class="fb" href="https://www.facebook.com/share/1Gyt67dsCz/" target="_blank" rel="noopener">👍 追蹤我們的 Facebook</a></div>
   <footer>內容為示範版本，語譯與賞析為本站整理撰寫。</footer></section>`;
}

function renderPoem(p){
  const i=POEMS.indexOf(p), prev=POEMS[i-1], next=POEMS[i+1];
  $("#main").innerHTML=tools()+`
  <div class="hero">
    <div class="poem" id="poemBox"><span class="t">${p.title}</span><span class="a">${p.dynasty}・${p.author}</span>
      ${p.lines.map((l,k)=>`<span class="l" data-k="${k}">${l}</span>`).join("")}</div>
    <div class="meta">
      <h2>${p.title}</h2>
      <div class="who">${p.dynasty}代　${p.author}</div>
      <span class="tag">${p.form}</span>
      <div style="margin-top:22px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn red" id="readBtn" onclick="read()">▶ 朗讀</button>
        <button class="btn" onclick="readSlow()">🐢 慢速朗讀</button>
      </div>
      <div class="tabs" id="tabs">
        <button data-t="notes">注釋</button><button data-t="trans">語譯</button>
        <button data-t="appr">賞析</button><button data-t="bio">作者</button>
      </div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
  <div class="pager">
    ${prev?`<button class="btn" onclick="go('${prev.id}')">← ${prev.title}</button>`:`<button class="btn" onclick="go('intro')">← 序言</button>`}
    ${next?`<button class="btn" onclick="go('${next.id}')">${next.title} →</button>`:`<span></span>`}
  </div><div class="fbBox"><p>喜歡這首詩嗎？🌸</p><p>追蹤我們的粉絲專頁，每週一起讀一首好詩、玩免費小遊戲！</p>
   <a class="fb" href="https://www.facebook.com/share/1Gyt67dsCz/" target="_blank" rel="noopener">👍 追蹤我們的 Facebook</a></div>`;
  $("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;showTab(p)}};
  showTab(p);
}

function showTab(p){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const P=$("#panel");
  if(tab==="notes") P.innerHTML=`<dl>${p.notes.map(n=>`<dt>【${n[0]}】</dt><dd>${n[1]}</dd>`).join("")}</dl>`;
  else P.textContent=p[tab];
}

function cur(){return POEMS.find(p=>p.id===location.hash.slice(1))}

function go(id){
  stop();
  if(location.hash.slice(1)!==id){location.hash=id;return}
  route();
}
function route(){
  const p=cur(); $("#side").classList.remove("open");
  buildNav(p?p.id:"intro");
  p?renderPoem(p):renderIntro();
  window.scrollTo(0,0);
}

function zoom(d){
  const s=document.documentElement.style;
  let v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||1;
  v=Math.min(1.6,Math.max(.8,v+d)); s.setProperty("--fs",v);
}
function copyLink(){
  try{navigator.clipboard.writeText(location.href).then(()=>toast("連結已複製 (*^^*)"),()=>toast("複製失敗，請手動複製網址"))}
  catch(e){toast("複製失敗，請手動複製網址")}
}

function pickVoice(){
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang));
}
function stop(){
  reading=false;
  try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll(".poem .l").forEach(x=>x.classList.remove("now"));
  const b=$("#readBtn"); if(b) b.textContent="▶ 朗讀";
  if(typeof musicOn!=="undefined"&&musicOn) setVol(.7);
}
function readSlow(){read(.6)}
function read(rate=.85){
  if(!("speechSynthesis" in window)){toast("這個瀏覽器不支援朗讀 >_<");return}
  if(reading){stop();return}
  const p=cur(); if(!p) return;
  reading=true; $("#readBtn").textContent="■ 停止";
  if(musicOn) setVol(.12,.6);
  const parts=[p.title+"，"+p.dynasty+"，"+p.author].concat(p.lines);
  const voice=pickVoice();
  let k=0;
  const next=()=>{
    if(!reading) return;
    document.querySelectorAll(".poem .l").forEach(x=>x.classList.remove("now"));
    if(k>=parts.length){stop();return}
    if(k>0){const el=document.querySelector(`.poem .l[data-k="${k-1}"]`); if(el) el.classList.add("now")}
    const u=new SpeechSynthesisUtterance(parts[k]);
    u.lang="zh-TW"; u.rate=rate; if(voice) u.voice=voice;
    u.onend=()=>{k++; setTimeout(next,350)};
    u.onerror=()=>{stop()};
    speechSynthesis.speak(u);
  };
  next();
}
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

/* ===== 古箏背景音樂（Web Audio 即時合成，撥弦音色） ===== */
let actx=null, master=null, verb=null, musicOn=false, musicTimer=null, nextT=0, cache={}, note=5, phrase=0, userOff=false;
try{userOff=localStorage.getItem("guzhengOff")==="1"}catch(e){}
const ROOT=293.66, PENTA=[0,2,4,7,9];
const freqOf=i=>{const o=Math.floor(i/5), s=PENTA[((i%5)+5)%5]; return ROOT*Math.pow(2,o-1+s/12)};
function strBuf(f){
  const k=f.toFixed(2); if(cache[k]) return cache[k];
  const sr=actx.sampleRate, N=Math.max(2,Math.round(sr/f)), len=Math.floor(sr*3.2);
  const b=actx.createBuffer(1,len,sr), d=b.getChannelData(0);
  for(let i=0;i<N;i++) d[i]=(Math.random()*2-1)*(1-i/N*.5);
  const damp=f>500?.993:.997;
  for(let i=N;i<len;i++) d[i]=damp*.5*(d[i-N]+d[i-N+1]);
  return cache[k]=b;
}
// iPhone 靜音鍵開著時 Web Audio 會被靜音：先播一段無聲 <audio>，把聲音切成「媒體播放」模式
function silentWav(){
  const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
let unlockEl=null;
function unlockIOS(){
  try{if(navigator.audioSession) navigator.audioSession.type="playback"}catch(e){}
  try{
    if(!unlockEl){unlockEl=document.createElement("audio");unlockEl.src=silentWav();unlockEl.loop=true;unlockEl.setAttribute("playsinline","");}
    const p=unlockEl.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){}
}
function initAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=0;
  const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
  const sr=actx.sampleRate, L=sr*2.8, ir=actx.createBuffer(2,L,sr);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
  verb=actx.createConvolver(); verb.buffer=ir;
  const wet=actx.createGain(); wet.gain.value=.35;
  lp.connect(master); lp.connect(verb); verb.connect(wet); wet.connect(master);
  master.connect(actx.destination); master.input=lp;
}
function pluck(f,t,v=.5,bend=false){
  const s=actx.createBufferSource(); s.buffer=strBuf(f);
  const g=actx.createGain(); g.gain.setValueAtTime(v,t); g.gain.setTargetAtTime(0,t+2.2,.4);
  if(bend){s.playbackRate.setValueAtTime(1,t+.18);s.playbackRate.linearRampToValueAtTime(1.06,t+.45);s.playbackRate.linearRampToValueAtTime(1,t+.9)}
  s.connect(g); g.connect(master.input); s.start(t); s.stop(t+3.2);
}
function schedule(){
  const beat=.56;
  while(nextT<actx.currentTime+1.2){
    if(phrase===0){pluck(freqOf(Math.random()<.5?0:3),nextT,.45)}
    if(Math.random()<.1){ // 刮奏 glissando
      for(let j=0;j<7;j++) pluck(freqOf(note-3+j),nextT+j*.055,.22);
      note=Math.min(11,note+3); nextT+=beat*2; phrase=(phrase+1)%8; continue;
    }
    note+=[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)];
    note=Math.max(3,Math.min(12,note));
    pluck(freqOf(note),nextT,.38+Math.random()*.15,Math.random()<.18);
    nextT+=beat*[1,1,.5,1.5,1,2][Math.floor(Math.random()*6)];
    phrase++; if(phrase>=8){phrase=0;nextT+=beat*1.5}
  }
}
function setVol(v,time=1.5){if(master){master.gain.cancelScheduledValues(actx.currentTime);master.gain.setTargetAtTime(v,actx.currentTime,time/3)}}
function musicStart(){
  try{
    unlockIOS();
    if(!actx) initAudio();
    if(actx.state!=="running"){
      // iOS 的小技巧：在點擊當下播一個極短的空白音，喚醒音訊
      const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);
      actx.resume();
    }
    if(musicOn) return;
    musicOn=true; nextT=actx.currentTime+.2;
    setVol(reading?.12:.7); schedule(); musicTimer=setInterval(schedule,250);
    updMusicBtn();
  }catch(e){toast("這個瀏覽器無法播放音樂 >_<")}
}
function musicStop(){musicOn=false;clearInterval(musicTimer);setVol(0,.6);updMusicBtn()}
function toggleMusic(e){
  e.stopPropagation();
  if(musicOn){musicStop();userOff=true}else{userOff=false;musicStart()}
  try{localStorage.setItem("guzhengOff",userOff?"1":"0")}catch(_){}
}
if(userOff) setTimeout(()=>$("#tapHint").classList.add("hide"),0);
document.addEventListener("pointerdown",()=>$("#tapHint").classList.add("hide"),{once:true});
function updMusicBtn(){document.body.classList.toggle("playing",musicOn);const b=$("#musicBtn");b.textContent=musicOn?"🎵 古箏 開":"🔇 古箏 關";b.classList.toggle("on",musicOn)}
// 瀏覽器規定要先點一下才能出聲，所以第一次點畫面任何地方就自動開始
// iPhone 要用 click/touchend 才算「使用者點擊」，pointerdown 不算
["click","touchend","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(!userOff&&!musicOn)musicStart()},true));

$("#backdrop").innerHTML=scene(true);
$("#zhengSide").innerHTML=guzheng()+'<span class="lbl">點我彈古箏 🎵</span>';
window.addEventListener("hashchange",route);
route();
</script>
